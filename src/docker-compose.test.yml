# Test overlay — DB + API + Demo in Docker, no host port exposure.
# Start: make up ENV=test
# Run demo: make demo ENV=test

services:
  battle-arena-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Test

  battle-arena-demo:
    build:
      context: ..
      dockerfile: src/BattleArena.Demo/Dockerfile
    stdin_open: true
    tty: true
    profiles:
      - demo
    networks:
      - app-network
    depends_on:
      battle-arena-db:
        condition: service_healthy
      battle-arena-api:
        condition: service_started
    environment:
      DOTNET_ENVIRONMENT: Test
      BattleArenaApi__Url: "http://battle-arena-api:8585"
      BattleArenaApi__ApiKey: "BA-DEV-2024-SECRET"
