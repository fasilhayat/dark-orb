# Base compose file — deployment-safe defaults (no host ports, no demo service).
# Always combine with an environment overlay: docker-compose.<env>.yml
# Use the Makefile targets (make up, make demo) rather than invoking docker compose directly.

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:

services:
  battle-arena-db:
    build:
      context: ..
      dockerfile: src/postgres/Dockerfile
    hostname: battle-arena-db
    restart: unless-stopped
    networks:
      - app-network
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./.postgres-init:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: battle-arena_data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: ["postgres",
              "-c", "shared_preload_libraries=pg_cron",
              "-c", "cron.database_name=battle-arena_data"]

  battle-arena-api:
    build:
      context: ..
      dockerfile: src/Dockerfile
    hostname: battle-arena-api
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      battle-arena-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ArenaDatabase: "Host=battle-arena-db;Port=5432;Database=battle-arena_data;Username=postgres;Password=postgres"
      ApiKeys__BattleArena: "BA-DEV-2024-SECRET"
