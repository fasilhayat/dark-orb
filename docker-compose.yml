networks:
  app-network:
    driver: bridge

services:
  battle-arena-db:
    build:
      context: .
      dockerfile: postgres/Dockerfile
    container_name: battle-arena-db
    hostname: battle-arena-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    networks:
      - app-network
    volumes:
      - ./.containers/postgres:/var/lib/postgresql/data
      - ./.postgres-init:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: battle-arena_data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: ["postgres",
              "-c", "shared_preload_libraries=pg_cron",
              "-c", "cron.database_name=battle-arena_data"]

  battle-arena-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: battle-arena-api
    restart: unless-stopped
    ports:
      - '8585:8585'
    networks:
      - app-network
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ArenaDatabase: "Host=battle-arena-db;Port=5432;Database=battle-arena_data;Username=postgres;Password=postgres"
